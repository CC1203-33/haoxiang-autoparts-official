<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2463"/>
      <stop offset="100%" style="stop-color:#2d4a6e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#g)"/>
  <rect width="800" height="600" fill="url(#grid)"/>
  <text x="400" y="280" text-anchor="middle" font-size="80" fill="rgba(255,255,255,0.9)">🛞</text>
  <text x="400" y="360" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">Brake System</text>
  <text x="400" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="rgba(255,255,255,0.7)">Pads, Discs, Calipers</text>
</svg>